schema_version: 1
project:
  name: ITAP-platform
  slug: itap-platform
  status: active
  created_at: '2026-09-11'
  project_type: python, streamlit
intent:
  summary: '

    We are building an application, which will help organize the newly recruited workforce
    into training and transition on the job, they are managed by a central team and
    get stationed with Line different managers to work and get trained in various
    job skills. They will be measured by the respective manager on their skills, and
    certain pre agreed tasks. The tool should allow onboarding on resources by the
    central team, then the central team assigns the members to different managers
    or functions, with a start and end date , where the end date is editable by the
    central team upon request by the manager, meaning the resources gets extended
    into the same team for let us say 1 more Quarter, and every resources enters the
    Managers team via a goal setting exercise and exits the team with feedback agains
    the task some objective and some subjective assessment, and the individual is
    also able to give a feedback about the managers they worked with, once they complete
    a tenure the central team can swap them over the other possible teams. we need
    to build a system capable of handling and managing all of these.'
agent:
  preferred: claude-cowork
frameworks: []
workspace:
  inputs: ./inputs
  artifacts: ./artifacts
  docs: ./docs
  scratch: ./workspace/scratch
downloads:
  default_external_location: ~/Downloads
  project_destination: ./inputs
  cleanup_external_copy: true
