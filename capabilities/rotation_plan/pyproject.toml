[project]
name = "rotation_plan"
version = "0.1.0"
description = "ITAP rotation plans: a fixed, named sequence of stages an intern is enrolled into, and where they currently stand along it."
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
