[project]
name = "catalog"
version = "0.1.0"
description = "ITAP Setup catalogs (Skills, Teams, CCA activities) plus lean associate self-service records (profile, interest flags, annual leave)."
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
