[project]
name = "assignment"
version = "0.1.0"
description = "ITAP assignment lifecycle: state machine, goal setting, closure scoring, reverse feedback."
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
